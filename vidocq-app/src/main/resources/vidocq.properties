# Port different de quarkus-app (8080) pour pouvoir lancer les deux demos
# en meme temps pendant la conference.
vidocq.chappe.listener.default.host=0.0.0.0
vidocq.chappe.listener.default.port=8081

# API REST exposee par Cassini (Jakarta RESTful Web Services 4.0).
vidocq.http.mount.api.path=/api
vidocq.http.mount.api.type=restful
